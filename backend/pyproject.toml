[project]
name = "terra-backend"
version = "0.1.0"
description = "Terra — Earth Observation, without the plumbing. Backend + EO processing engine."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers -m \"not network\""
markers = [
    "network: test hits the live Earth Search STAC API / remote COGs (skipped by default; run with -m network)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # line length handled by formatter; comments/docstrings may run long

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true    # rasterio/pystac_client/shapely ship partial stubs
disallow_untyped_defs = false
