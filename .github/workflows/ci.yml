name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check app tests

      - name: Ruff format check
        run: python -m ruff format --check app tests

      # Offline, deterministic tests only (default marker expression excludes
      # `network`) — no AWS credentials or internet access required, matching
      # CLAUDE.md golden rule 4.
      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing

  validate-template:
    name: Validate SAM template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: Lint CloudFormation/SAM template
        run: cfn-lint infra/template.yaml

  frontend:
    name: Lint + build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Next.js 16 needs Node >= 20.9.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` also runs the TypeScript check, and the `prebuild` hook
      # copies MapLibre's worker into public/ (see
      # frontend/scripts/copy-maplibre-worker.mjs). No env vars are required:
      # with no Cognito ids the app builds in open "demo mode".
      - name: Build
        run: npm run build
