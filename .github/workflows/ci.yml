name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check app tests

      - name: Ruff format check
        run: python -m ruff format --check app tests

      # Offline, deterministic tests only (default marker expression excludes
      # `network`) — no AWS credentials or internet access required, matching
      # CLAUDE.md golden rule 4.
      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing

  validate-template:
    name: Validate SAM template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: Lint CloudFormation/SAM template
        run: cfn-lint infra/template.yaml
