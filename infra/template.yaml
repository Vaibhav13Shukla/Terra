AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Terra — Earth Observation, without the plumbing.
  API Gateway (HTTP API) -> Lambda (container image, FastAPI via Mangum)
  -> DynamoDB (job state) + S3 (results/evidence) + Bedrock (optional, intent/explain).
  See docs/architecture.md and docs/adr/ for design rationale.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  BedrockEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable optional Bedrock intent/explain (deterministic fallback always available, §61)
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-5-haiku-20241022-v1:0
  AuthEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Require a valid Cognito token on the analyses endpoints. The User Pool
      is always created (so it's ready to wire into the frontend); this
      toggles whether the API actually enforces it, so infra can be deployed
      before the frontend's login flow is finished (§61 — never block on
      auth to demo the core pipeline).
  FrontendOrigin:
    Type: String
    Default: "*"
    Description: >-
      Deployed frontend origin for CORS, e.g. https://app.example.com.
      Defaults to "*" for early development; set this to the real origin
      before sharing the API publicly (§31).
  ProcessingMode:
    Type: String
    Default: sync
    AllowedValues: [sync, async]
    Description: >-
      'sync' (default): the API runs the analysis inline and returns the
      completed result in one request — simplest to demo, and fast enough
      for the hackathon's small-AOI workload (see docs/adr/002). 'async':
      the API enqueues to SQS and returns immediately; WorkerFunction
      processes the queue and resolves the job, same as a production-scale
      deployment would. The queue and worker are always deployed either way
      so switching modes is a parameter change, not a redeploy of new
      resources.

Globals:
  Function:
    # No global Timeout on purpose: the API and the worker have very different
    # limits (API Gateway cuts HTTP APIs off at 30 s; a live analysis can take
    # minutes), so each function sets its own below. A single global value was
    # silently applying the API's short limit to the worker.
    MemorySize: 1024      # rasterio/GDAL + numpy benefit from headroom over the 128MB default
    # Pinned so the image built on your machine matches the Lambda it runs on
    # (an arm64 laptop would otherwise build an image x86_64 Lambda can't run).
    Architectures: [x86_64]
    Environment:
      Variables:
        TERRA_JOB_STORE: dynamodb
        DYNAMODB_TABLE: !Ref AnalysesTable
        S3_RESULTS_BUCKET: !Ref ResultsBucket
        AWS_REGION_NAME: !Ref AWS::Region
        BEDROCK_ENABLED: !Ref BedrockEnabled
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        AUTH_ENABLED: !Ref AuthEnabled
        COGNITO_USER_POOL_ID: !Ref TerraUserPool
        COGNITO_APP_CLIENT_ID: !Ref TerraUserPoolClient
        COGNITO_REGION: !Ref AWS::Region
        CORS_ALLOW_ORIGINS: !Ref FrontendOrigin
        TERRA_PROCESSING_MODE: !Ref ProcessingMode
        ANALYSES_QUEUE_URL: !Ref AnalysesQueue

Resources:
  # ------------------------------------------------------------------ #
  # API
  # ------------------------------------------------------------------ #
  TerraHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # No StageName => SAM uses API Gateway's special "$default" stage, whose
      # URL has NO stage prefix (https://<id>.execute-api.<region>.amazonaws.com/).
      # A named stage ("dev") would put /dev in every request path; the FastAPI
      # app + Mangum adapter don't strip it, so every route — /health included —
      # returned 404 (reproduced by driving the app's Lambda handler with an API
      # Gateway v2 event for rawPath "/dev/health"). `Stage` still names the
      # other resources (functions, table, queues) so environments stay separate.
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowMethods: ["GET", "POST"]
        AllowHeaders: ["*", "Authorization"]
      # Basic abuse/cost protection (§45, §67) -- a public, unauthenticated
      # API needs a request ceiling even at hackathon scale. Deliberately
      # modest: raise if legitimate demo/judging traffic gets throttled.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    # Resource-level attribute (a sibling of Properties, not inside it). There is
    # deliberately no ImageUri: `sam build` builds the image from this and
    # `sam deploy --resolve-image-repos` creates the ECR repository and pushes it.
    # (A hard-coded ImageUri pointed at a repository nothing created, so the first
    # deploy could never have found an image.) Paths are relative to THIS template
    # (infra/); the build context is the repo root because the Dockerfile copies
    # backend/ — see /.dockerignore, which keeps .venv, node_modules and .git out.
    Metadata:
      DockerContext: ..
      Dockerfile: infra/Dockerfile
      DockerTag: latest
    Properties:
      FunctionName: !Sub terra-api-${Stage}
      PackageType: Image
      # HTTP APIs cap an integration at 30 s, so a longer Lambda timeout would
      # only mean the client gets a 503 while Lambda keeps (and bills) running.
      # Longer work belongs in ProcessingMode=async (WorkerFunction below).
      Timeout: 30
      # Container image (not a zip) because rasterio/GDAL exceed the 250MB
      # zip-deployment limit (§Lambda in the brief; see docs/adr/002).
      Events:
        AnyRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref TerraHttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysesTable
        - S3CrudPolicy:
            BucketName: !Ref ResultsBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AnalysesQueue.QueueName
        - Statement:
            # Least privilege (§31, §91): only the Bedrock actions Terra
            # actually calls, only when Bedrock is enabled at all. No
            # AdministratorAccess, no wildcard resource beyond what Bedrock
            # runtime invocation requires.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"

  # ------------------------------------------------------------------ #
  # Async processing (ProcessingMode=async — see app.worker.handler)
  # ------------------------------------------------------------------ #
  AnalysesDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub terra-analyses-dlq-${Stage}
      MessageRetentionPeriod: 1209600   # 14 days (max) — time to investigate a poison message

  AnalysesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub terra-analyses-${Stage}
      # AWS's guidance for a Lambda SQS trigger is a visibility timeout of at least
      # 6x the function timeout (WorkerFunction: 300 s), so a slow-but-healthy job
      # is never redelivered — and processed twice — while still running.
      VisibilityTimeout: 1800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalysesDLQ.Arn
        maxReceiveCount: 3   # a request that fails 3x is a real failure, not a transient blip

  WorkerFunction:
    Type: AWS::Serverless::Function
    # Same image contents as ApiFunction (same app code/dependencies) — only the
    # invoked entry point differs, via ImageConfig.Command overriding the
    # Dockerfile's default CMD. Same Dockerfile/context, built for this function.
    Metadata:
      DockerContext: ..
      Dockerfile: infra/Dockerfile
      DockerTag: latest
    Properties:
      FunctionName: !Sub terra-worker-${Stage}
      PackageType: Image
      # Live Sentinel-2 analyses were measured at ~20-30 s for a ~25 km² field
      # but ~200 s for a ~47 km² one. The worker inherited a 60 s global timeout,
      # so any longer job would be killed, redelivered 3x, then dead-lettered.
      # 300 s covers that with headroom; Lambda's hard ceiling is 900 s.
      Timeout: 300
      ImageConfig:
        Command: ["app.worker.handler.handler"]
      Events:
        AnalysesQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalysesQueue.Arn
            BatchSize: 1   # one analysis per invocation keeps failure isolation simple (§53)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysesTable
        - S3CrudPolicy:
            BucketName: !Ref ResultsBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"

  WorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/terra-worker-${Stage}
      RetentionInDays: 30

  # ------------------------------------------------------------------ #
  # Auth
  # ------------------------------------------------------------------ #
  TerraUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub terra-users-${Stage}
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          Required: true
          Mutable: true

  TerraUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub terra-web-${Stage}
      UserPoolId: !Ref TerraUserPool
      GenerateSecret: false   # public SPA client (frontend), never store a secret in browser JS
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ------------------------------------------------------------------ #
  # State
  # ------------------------------------------------------------------ #
  AnalysesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub terra-analyses-${Stage}
      BillingMode: PAY_PER_REQUEST   # no idle cost for a hackathon-scale workload (§67)
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true   # bound storage growth automatically (§67)

  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub terra-results-${AWS::AccountId}-${Stage}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldResults
            Status: Enabled
            ExpirationInDays: 30   # cost discipline for a hackathon demo bucket (§67)
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ------------------------------------------------------------------ #
  # Observability
  # ------------------------------------------------------------------ #
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/terra-api-${Stage}
      RetentionInDays: 30

Outputs:
  ApiUrl:
    Description: Terra API base URL (no stage prefix — $default stage; no trailing slash)
    Value: !Sub "https://${TerraHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ResultsBucketName:
    Value: !Ref ResultsBucket
  AnalysesTableName:
    Value: !Ref AnalysesTable
  CognitoUserPoolId:
    Description: Cognito User Pool id — the frontend's auth SDK (e.g. Amplify) needs this
    Value: !Ref TerraUserPool
  CognitoAppClientId:
    Description: Cognito App Client id — the frontend's auth SDK needs this
    Value: !Ref TerraUserPoolClient
  AnalysesQueueUrl:
    Description: SQS queue URL used when ProcessingMode=async
    Value: !Ref AnalysesQueue
